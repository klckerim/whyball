[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whyball"
version = "0.1.0"
description = "Multi-agent football match narrator; every claim is verified against deterministic metrics."
requires-python = ">=3.12"
# fastapi, starlette and pydantic are pinned: web/openapi.json is compared byte for byte with the app's
# schema (tests/test_openapi.py), so CI, local runs and the Docker build must render it with the same versions.
dependencies = [
    "fastapi==0.143.0", "starlette==1.7.0", "pydantic==2.14.1", "uvicorn[standard]>=0.30", "httpx>=0.27",
]

[project.optional-dependencies]
# openai: tests/test_llm_narrator.py checks the draft schema with its strict-schema helper
# (otherwise only reached through the llm extra).
# agent-framework-core: the agent workflow tests (tests/test_agents_*.py) run a real workflow with a fake client.
dev = ["pytest>=8", "openai>=3.29", "agent-framework-core==1.19.0"]
# For Foundry (FoundryNarrator, app/llm/hello.py, app/agents); the service image does not install it.
# Exact versions: the newest releases at least two weeks old on 2026-10-14 (core 1.19.0 and foundry 1.13.1,
# 2026-09-18; the newer 1.20.0/1.21.0 and 1.14.x are younger than 14 days). openai 1.14.4 is the one from the
# same day; foundry 1.13.1 needs azure-ai-projects < 2.7.0, which pip resolves.
llm = [
    "agent-framework-core==1.19.0", "agent-framework-foundry==1.13.1", "agent-framework-openai==1.14.4",
    "azure-identity", "python-dotenv",
]
# Application Insights request traces (app/telemetry.py). Exact version: the newest release at least two
# weeks old when chosen (1.3.9, 2026-09-09). The container image installs it; without
# APPLICATIONINSIGHTS_CONNECTION_STRING nothing is imported or configured.
monitor = ["microsoft-opentelemetry==1.3.9"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
