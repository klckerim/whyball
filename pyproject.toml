[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whyball"
version = "0.1.0"
description = "Multi-agent football match narrator; every claim is verified against deterministic metrics."
requires-python = ">=3.12"
# fastapi, starlette and pydantic are pinned: web/openapi.json is compared byte for byte with the app's
# schema (tests/test_openapi.py), so CI, local runs and the Docker build must render it with the same versions.
dependencies = [
    "fastapi==0.143.0", "starlette==1.7.0", "pydantic==2.14.1", "uvicorn[standard]>=0.30", "httpx>=0.27",
]

[project.optional-dependencies]
# openai: tests/test_llm_narrator.py checks the draft schema with its strict-schema helper
# (otherwise only reached through the llm extra).
dev = ["pytest>=8", "openai>=3.29"]
# For Foundry (FoundryNarrator, app/llm/hello.py); the core and the tests do not need it.
llm = ["agent-framework-foundry", "azure-identity", "python-dotenv"]
# Application Insights request traces (app/telemetry.py). Exact version: the newest release at least two
# weeks old when chosen (1.3.9, 2026-09-09). The container image installs it; without
# APPLICATIONINSIGHTS_CONNECTION_STRING nothing is imported or configured.
monitor = ["microsoft-opentelemetry==1.3.9"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
