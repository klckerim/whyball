[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whyball"
version = "0.1.0"
description = "Multi-agent football match narrator; every claim is verified against deterministic metrics."
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# For Foundry (FoundryNarrator, app/llm/hello.py); the core and the tests do not need it.
llm = ["agent-framework-foundry", "azure-identity", "python-dotenv"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
