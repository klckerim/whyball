[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whyball"
version = "0.1.0"
description = "Çok ajanlı futbol maç anlatıcısı; her iddia deterministik metriklerle doğrulanır."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
# Foundry (FoundryNarrator, app/llm/hello.py) için; çekirdek ve testler gerektirmez.
llm = ["agent-framework-foundry", "azure-identity", "python-dotenv"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
