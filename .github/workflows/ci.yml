name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs; the comment names the release.

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # API types: src/api/schema.gen.ts must match openapi.json (the python job checks openapi.json
      # against the app). The generator has its own install (docs/DESIGN.md D10).
      - run: npm ci --prefix tools/openapi-gen
      - run: npm run check:api
      - run: npm test -- --run
      - run: npm run build

  gitleaks:
    # gitleaks-action needs GITLEAKS_LICENSE only for organization-owned repos;
    # this repo belongs to a personal account, so no license key is set.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  docker:
    # Builds the image without pushing it, checks that no secrets or history are inside, and starts it once.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t whyball:ci .
      - name: Image holds no .env, notes or .git
        run: |
          found=$(docker run --rm --user root --entrypoint sh whyball:ci -c \
            'find / -xdev \( -name ".env" -o -name ".env.*" -o -name notes -o -name .git \) -not -path "/proc/*" -not -path "*/site-packages/*"')
          if [ -n "$found" ]; then echo "forbidden paths in the image:"; echo "$found"; exit 1; fi
      - name: Image starts and answers
        run: |
          docker run -d --name whyball-ci -p 8000:8000 whyball:ci
          python3 scripts/smoke_remote.py http://127.0.0.1:8000 || { docker logs whyball-ci; exit 1; }
